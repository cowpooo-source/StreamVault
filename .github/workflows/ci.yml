name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: stalker-proxy/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: stalker-proxy
      - name: Run tests
        run: npm test
        working-directory: stalker-proxy

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: streamvault/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: streamvault
      - name: Lint
        run: npm run lint
        working-directory: streamvault
      - name: Unit tests
        run: npm test
        working-directory: streamvault
      - name: Build
        run: npm run build
        working-directory: streamvault

  e2e:
    name: E2E Browser Tests
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: streamvault/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: streamvault
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: streamvault
      - name: Run E2E tests
        run: npm run e2e
        working-directory: streamvault
        env:
          CI: true
      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            streamvault/playwright-report/
            streamvault/test-results/playwright/
          retention-days: 30
