server {
    listen 80;
    server_name sandbox.portalheaven.stream;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name sandbox.portalheaven.stream;

    client_max_body_size 10M;

    ssl_certificate /etc/letsencrypt/live/sandbox.portalheaven.stream/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sandbox.portalheaven.stream/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /home/opc/StreamVault-sandbox/streamvault/dist;
    index index.html;

    location = /app {
        try_files /app.html =404;
    }

    location = /app/ {
        try_files /app.html =404;
    }

    location = /content {
        try_files /app.html =404;
    }

    location = /content/ {
        try_files /app.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf|map)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /stalker/ {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
    }

    location /stream {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
    }

    location /proxy {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /img {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /analytics {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
