# Local testing of feature/direct-play-no-proxy.
# Exposes one HTTP origin on :3201 so /content is served by the SPA and
# same-origin /api calls route to the backend.
services:
  backend:
    build:
      context: ./stalker-proxy
      dockerfile: Dockerfile
    volumes:
      - ./stalker-proxy/src:/home/node/app/src
      - ./stalker-proxy/package.json:/home/node/app/package.json
      - stalker-data:/home/node/app/data
    environment:
      - PORT=3001
      - NODE_ENV=${NODE_ENV:-development}
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN:-http://127.0.0.1:3201}
      - ADMIN_PASS=${ADMIN_PASS:?ADMIN_PASS must be set}
      - TURNSTILE_REQUIRED=${TURNSTILE_REQUIRED:-false}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-}
      - PLAYER_BASE=http://127.0.0.1:3201
      - APP_URL=http://127.0.0.1:3201/app
      - CONTENT_BASE_URL=http://127.0.0.1:3201
      - CONTENT_SESSION_TTL_MINUTES=30
      - CONTENT_SESSION_MAX_PER_USER=5
      - TOKEN_MASTER_KEY=${TOKEN_MASTER_KEY:?TOKEN_MASTER_KEY must be set}
    networks:
      - streamvault-feature-net

  frontend:
    build:
      context: ./streamvault
      dockerfile: Dockerfile
    volumes:
      - ./streamvault:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=${VITE_API_URL:-}
      - VITE_TURNSTILE_SITE_KEY=${VITE_TURNSTILE_SITE_KEY:-}
      - VITE_SECURE_APP_BASE_URL=${VITE_SECURE_APP_BASE_URL:-http://127.0.0.1:3201/app}
    networks:
      - streamvault-feature-net

  gateway:
    image: nginx:alpine
    ports:
      - "3201:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - streamvault-feature-net

volumes:
  stalker-data:

networks:
  streamvault-feature-net:
    driver: bridge
