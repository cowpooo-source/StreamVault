# Local testing of feature/direct-play-no-proxy.
# Exposes one HTTP origin on :3201 so /content is served by the SPA and
# same-origin /api calls route to the backend.
services:
  backend:
    build:
      context: ./stalker-proxy
      dockerfile: Dockerfile
    volumes:
      - ./stalker-proxy/src:/home/node/app/src
      - ./stalker-proxy/package.json:/home/node/app/package.json
      - stalker-data:/home/node/app/data
    environment:
      - PORT=3001
      - ALLOWED_ORIGIN=*
      - ADMIN_PASS=Mango!123
      - PLAYER_BASE=http://localhost:3201
      - APP_URL=http://localhost:3201/app
      - CONTENT_BASE_URL=http://localhost:3201
      - CONTENT_SESSION_TTL_MINUTES=30
      - CONTENT_SESSION_MAX_PER_USER=5
      - TOKEN_MASTER_KEY=9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
    networks:
      - streamvault-feature-net

  frontend:
    build:
      context: ./streamvault
      dockerfile: Dockerfile
    volumes:
      - ./streamvault:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=
      - VITE_SECURE_APP_BASE_URL=http://localhost:3201/app
    networks:
      - streamvault-feature-net

  gateway:
    image: nginx:alpine
    ports:
      - "3201:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - streamvault-feature-net

volumes:
  stalker-data:

networks:
  streamvault-feature-net:
    driver: bridge
