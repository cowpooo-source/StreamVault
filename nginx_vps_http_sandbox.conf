# StreamVault HTTP sandbox — no stream byte proxy
# Xtream/M3U streams go direct browser→provider.
# Only auth, sync, and Stalker proxy routes hit the backend.
# Backend runs on port 3101 (PM2).

server {
    listen 80;
    server_name sandbox.portalheaven.stream;

    client_max_body_size 10M;

    root /home/opc/StreamVault-Feature/streamvault/dist;
    index app.html;

    # SPA fallback — all non-file routes serve index.html
    location / {
        try_files $uri $uri/ /app.html;
    }

    # Static asset caching (1 year)
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf|map)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ── Backend proxy routes (kept) ────────────────────────────
    # Auth, user management, server sync
    location /api/ {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Stalker portal proxy (portal header injection, create_link)
    location /stalker/ {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
    }

    # Analytics dashboard page
    location /analytics {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Health check
    location /health {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ── Stream proxy routes (removed) ──────────────────────────
    # NOT NEEDED: Xtream/M3U streams go DIRECT browser→provider
    # The app sets _direct: true on those items, so the Player
    # never calls /stream. The backend does NOT need to proxy
    # stream bytes.
    #
    # Removed: /stream, /proxy, /img
}