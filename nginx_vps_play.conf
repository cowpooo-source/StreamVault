server {
    listen 80;
    server_name play.portalheaven.stream;

    client_max_body_size 10M;

    root /home/opc/StreamVault-Feature/streamvault/dist;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/play.portalheaven.stream.access.log;
    error_log  /var/log/nginx/play.portalheaven.stream.error.log;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static asset cache (1 year)
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf|map)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Auth, sync, servers API
    location /api/ {
        proxy_pass http://127.0.0.1:3201;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Stalker proxy (portal header injection)
    location /stalker/ {
        proxy_pass http://127.0.0.1:3201;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
    }

    # Analytics
    location /analytics {
        proxy_pass http://127.0.0.1:3201;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Health
    location /health {
        proxy_pass http://127.0.0.1:3201;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Token-gated player page
    location /player {
        proxy_pass http://127.0.0.1:3201;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Validate play token (also goes to play backend)
    location = /api/validate-token {
        proxy_pass http://127.0.0.1:3201;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # No stream byte proxy — Xtream/M3U go direct via _direct: true
    # Removed: /stream, /proxy, /img
}

# HTTPS -> HTTP redirect
server {
    listen 443 ssl;
    server_name play.portalheaven.stream;

    ssl_certificate     /etc/nginx/snippets/media-selfsigned.crt;
    ssl_certificate_key /etc/nginx/snippets/media-selfsigned.key;

    return 301 http://$host$request_uri;
}
