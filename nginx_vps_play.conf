# play.portalheaven.stream
# HTTP-only subdomain for direct stream playback.
# The main SPA (login/setup/browsing) lives on HTTPS; this domain serves:
#   - /player  — minimal player page (token-gated direct play)
#   - /proxy   — Xtream/M3U data proxy (channel lists, EPG, VOD)
#   - /api/    — auth, sync, token validation
#   - /stalker/— Stalker portal proxy

server {
    listen 80;
    server_name play.portalheaven.stream;

    client_max_body_size 10M;

    root /home/opc/StreamVault-Feature/streamvault/dist;
    index app.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/play.portalheaven.stream.access.log;
    error_log  /var/log/nginx/play.portalheaven.stream.error.log;

    # Token-gated player page
    location /player {
        proxy_pass http://127.0.0.1:3201;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Data proxy for Xtream/M3U/Stalker API calls
    location /proxy {
        proxy_pass http://127.0.0.1:3201;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # Auth, sync, servers API (includes play-token, validate-token)
    location /api/ {
        proxy_pass http://127.0.0.1:3201;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Stalker proxy
    location /stalker/ {
        proxy_pass http://127.0.0.1:3201;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
    }

    # Health
    location /health {
        proxy_pass http://127.0.0.1:3201;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # SPA fallback (TEMPORARY — will move to HTTPS)
    location / {
        try_files $uri $uri/ /app.html;
    }
}

# HTTPS -> HTTP redirect
server {
    listen 443 ssl;
    server_name play.portalheaven.stream;

    ssl_certificate     /etc/nginx/snippets/media-selfsigned.crt;
    ssl_certificate_key /etc/nginx/snippets/media-selfsigned.key;

    return 301 http://$host$request_uri;
}
