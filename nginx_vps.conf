server {
    listen 80;
    server_name streamvault.hopto.org;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    server_name portalheaven.stream www.portalheaven.stream;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name streamvault.hopto.org;

    client_max_body_size 10M;

    ssl_certificate /etc/letsencrypt/live/streamvault.hopto.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/streamvault.hopto.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /home/opc/StreamVault/streamvault/dist;
    index index.html;

    # Efficiency: single location block for all node-handled paths
    # Note: analytics is matched as a word boundary to allow analytics.png to be served as static
    location ~ ^/(stalker|stream|proxy|health|api|img|analytics($|/)) {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf|map)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}

server {
    listen 443 ssl;
    server_name portalheaven.stream www.portalheaven.stream;

