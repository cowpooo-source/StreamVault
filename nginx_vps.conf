server {
    listen 80;
    server_name portalheaven.stream www.portalheaven.stream streamvault.hopto.org 40.233.113.76;

    if ($host = portalheaven.stream) { return 301 https://portalheaven.stream$request_uri; }
    if ($host = www.portalheaven.stream) { return 301 https://portalheaven.stream$request_uri; }
    if ($host = streamvault.hopto.org) { return 301 https://streamvault.hopto.org$request_uri; }

    root /opt/streamvault/streamvault/dist;
    index app.html;
    server_tokens off;

    location = / { try_files /app.html =404; }
    location = /app {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files /app.html =404;
    }
    location ^~ /app/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files /app.html =404;
    }
    location = /content {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files /app.html =404;
    }
    location / { try_files $uri =404; }

    location ^~ /assets/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|webp|avif|gif|ico|svg|woff|woff2|ttf|otf|map)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /stalker/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
    }
    location /stream {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
    }
    location /proxy {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /img {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /analytics {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}

server {
    listen 443 ssl;
    server_name portalheaven.stream www.portalheaven.stream;

    ssl_certificate /etc/letsencrypt/live/portalheaven.stream/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portalheaven.stream/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    if ($host = www.portalheaven.stream) { return 301 https://portalheaven.stream$request_uri; }

    root /opt/streamvault/streamvault/dist;
    index index.html;
    server_tokens off;
    error_page 404 /404.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = / { try_files /index.html =404; }
    location = /index.html { return 301 /; }
    location = /landing.html { return 301 /; }

    location = /app {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files /app.html =404;
    }
    location ^~ /app/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files /app.html =404;
    }
    location = /app.html { return 301 /app; }
    location = /content {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files /app.html =404;
    }

    location = /features { try_files /features.html =404; }
    location = /security { try_files /security.html =404; }
    location = /self-host { try_files /self-host.html =404; }
    location = /faq { try_files /faq.html =404; }
    location = /privacy { try_files /privacy.html =404; }
    location = /terms { try_files /terms.html =404; }

    location = /features.html { return 301 /features; }
    location = /security.html { return 301 /security; }
    location = /self-host.html { return 301 /self-host; }
    location = /faq.html { return 301 /faq; }
    location = /privacy.html { return 301 /privacy; }
    location = /terms.html { return 301 /terms; }
    location = /404.html { internal; }

    location / { try_files $uri =404; }

    location ^~ /assets/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|webp|avif|gif|ico|svg|woff|woff2|ttf|otf|map)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /stalker/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
    }
    location /stream {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
    }
    location /proxy {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /img {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /analytics {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}

