services:
  backend:
    build:
      context: ./stalker-proxy
      dockerfile: Dockerfile
    volumes:
      - ./stalker-proxy/src:/home/node/app/src
      - ./stalker-proxy/package.json:/home/node/app/package.json
      - ./stalker-proxy/data:/home/node/app/data
    environment:
      - PORT=3001
      - ALLOWED_ORIGIN=*
      - ADMIN_PASS=Mango!123
    networks:
      - streamvault-net

  frontend:
    build:
      context: ./streamvault
      dockerfile: Dockerfile
    volumes:
      - ./streamvault:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=
    networks:
      - streamvault-net

  gateway:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - streamvault-net

networks:
  streamvault-net:
    driver: bridge
